name: Eyan Aly

on:
  push:
    branches: [ main ]

jobs:
  demo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Flake8
        run: pip install flake8

      - name: Greetings
        run: echo "Hello From Apun"

      - name: Find Syntax Errors
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
